<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苗管理 N03 — R8.5.9</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --g0:#0d2318;--g1:#16382a;--g2:#28634a;--g3:#4aaa78;--g4:#a8dfc0;--g5:#e6f7ee;
  --am:#d4941a;--am2:#fef3d0;--red:#b83232;--red2:#fde8e8;
  --bl:#1a5fb4;--bl2:#ddeeff;--pu:#7c3aed;--pu2:#ede9fe;
  --gy:#f0ede6;--white:#fff;--text:#1a1a1a;--sub:#6b7280;--bdr:#e2ddd4;
  --sh:0 2px 16px rgba(13,35,24,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--gy);color:var(--text);min-height:100vh;font-size:14px;padding-bottom:80px}
header{background:var(--g0);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between}
.h-left h1{font-size:.9rem;font-weight:700}
.h-left .h-sub{font-size:.58rem;color:rgba(255,255,255,.38);margin-bottom:1px}
.hbadge{font-family:'Space Mono',monospace;font-size:.65rem;background:var(--g3);color:var(--g0);padding:2px 9px;border-radius:20px;font-weight:700}
.tabs{display:flex;background:var(--g1);overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:46px;padding:9px 2px;text-align:center;color:rgba(255,255,255,.38);font-size:.62rem;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;transition:.18s;white-space:nowrap}
.tab.active{color:var(--g4);border-bottom-color:var(--g3)}
.page{display:none;padding:12px 11px}
.page.active{display:block}
.stitle{font-size:.68rem;font-weight:700;color:var(--g2);letter-spacing:.09em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.stitle::after{content:'';flex:1;height:1px;background:var(--g4)}
.stitle:first-child{margin-top:0}

/* variety cards */
.vcard{background:var(--white);border-radius:13px;box-shadow:var(--sh);overflow:hidden;margin-bottom:9px;border-left:5px solid var(--g3)}
.vcard.warn{border-left-color:var(--am)}.vcard.done{border-left-color:var(--red)}
.vcard-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;user-select:none}
.vname{font-weight:700;font-size:.92rem;color:var(--g0)}
.vcard-pbar{height:5px;background:#e8e3da;border-radius:5px;overflow:hidden;margin-top:5px}
.vcard-pfill{height:100%;border-radius:5px;transition:width .4s}
.vcard-body{display:none;border-top:1px solid var(--bdr)}
.vcard-body.open{display:block}
.vn-row{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid #f0ede6;gap:8px}
.vn-row:last-child{border-bottom:none}
.vn-left{flex:1}
.vn-label{display:flex;align-items:center;gap:7px;font-weight:600;flex-wrap:wrap;font-size:.82rem}
.vn-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.pbtn{background:var(--g2);color:#fff;border:none;border-radius:8px;font-size:.72rem;font-weight:700;padding:5px 11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;transition:.15s;flex-shrink:0}
.pbtn:hover{background:var(--g1)}
.pbtn.ex{background:var(--sub);cursor:default}

/* tags */
.tag{font-size:.63rem;padding:2px 7px;border-radius:7px;background:var(--g5);color:var(--g1);white-space:nowrap;display:inline-block}
.tag.h{background:var(--g4);color:var(--g0)}
.tag.am{background:var(--am2);color:#7a5000}
.tag.bl{background:var(--bl2);color:#0f3a80}
.tag.pu{background:var(--pu2);color:#4c1d95}
.rb{font-size:.65rem;padding:2px 7px;border-radius:8px;font-weight:700;font-family:'Space Mono',monospace;white-space:nowrap;display:inline-block}
.rok{background:var(--g5);color:var(--g2)}.rzero{background:var(--red2);color:var(--red)}.rneg{background:#f8d7da;color:var(--red)}

/* sort bar */
.sort-bar{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.sort-lbl{font-size:.65rem;color:var(--sub);flex-shrink:0}
.spill{font-size:.67rem;padding:4px 10px;border-radius:18px;border:1.5px solid var(--bdr);background:var(--white);cursor:pointer;color:var(--sub);transition:.14s;font-family:'Noto Sans JP',sans-serif;white-space:nowrap}
.spill.active{background:var(--g2);color:#fff;border-color:var(--g2)}

/* stock cards */
.scard{background:var(--white);border-radius:12px;margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
.scard-row{display:flex;align-items:center;padding:10px 12px;gap:9px}
.scard-no{background:var(--g2);color:#fff;font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;padding:5px 7px;border-radius:8px;min-width:44px;text-align:center;flex-shrink:0}
.scard-info{flex:1;min-width:0}
.scard-variety{font-weight:700;font-size:.87rem}
.scard-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.scard-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.scard-nums{font-size:.66rem;color:var(--sub);font-family:'Space Mono',monospace}

/* ncard */
.ncard{background:var(--white);border-radius:13px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
.ncard-head{display:flex;align-items:stretch}
.ncard-num{background:var(--g2);color:#fff;font-family:'Space Mono',monospace;font-weight:700;width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:.5rem;gap:1px;padding:8px 0;line-height:1}
.ncard-num .nno{font-size:1.1rem;line-height:1}
.ncard-info{flex:1;padding:9px 11px;cursor:pointer}
.ncard-variety{font-weight:700;font-size:.88rem;color:var(--g0)}
.ncard-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ncard-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:9px 10px;gap:4px;min-width:66px}
.ncard-plants{border-top:1px solid var(--bdr);display:none}
.ncard-plants.open{display:block}
.prow{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #f0ede6;font-size:.8rem;gap:6px}
.prow:last-child{border:none}
.prow-l{display:flex;flex-direction:column;gap:3px;flex:1}
.prow-field{font-weight:600;color:var(--g0)}
.prow-meta{display:flex;gap:4px;flex-wrap:wrap}
.prow-count{font-family:'Space Mono',monospace;font-weight:700;color:var(--am);font-size:.86rem;white-space:nowrap}
.prow-note{font-size:.66rem;color:var(--sub);font-style:italic}

/* plant card */
.plant-no-card{background:var(--white);border-radius:12px;margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
.plant-no-head{background:var(--am);color:var(--g0);padding:8px 13px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.86rem;flex-wrap:wrap;gap:5px}
.plant-row{padding:8px 13px;border-bottom:1px solid #f0ede6;font-size:.81rem}
.plant-row:last-child{border:none}

/* field card */
.fcard{background:var(--white);border-radius:12px;margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
.fcard-head{background:var(--pu);color:#fff;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.86rem;cursor:pointer}
.fcard-body{display:none;border-top:1px solid var(--bdr)}
.fcard-body.open{display:block}
.fcard-row{display:flex;align-items:center;justify-content:space-between;padding:7px 13px;border-bottom:1px solid #f0ede6;font-size:.8rem;gap:6px}
.fcard-row:last-child{border:none}

/* summary */
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sc{background:var(--white);border-radius:11px;padding:11px 12px;box-shadow:var(--sh);border-left:4px solid var(--g3)}
.sc.am{border-left-color:var(--am)}.sc.bl{border-left-color:var(--bl)}
.sc .lbl{font-size:.63rem;color:var(--sub);margin-bottom:3px}
.sc .val{font-family:'Space Mono',monospace;font-size:1.35rem;font-weight:700;color:var(--g0)}
.sc .sub2{font-size:.63rem;color:var(--sub);margin-top:2px}

/* fbar */
.fbar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.fbar input{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--g4);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.8rem;background:var(--white);outline:none}

/* nae add panel */
.nae-panel{background:var(--g5);border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.nae-panel-title{font-size:.75rem;font-weight:700;color:var(--g2);margin-bottom:10px}
.nae-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nae-full{grid-column:1/-1}
.ni{display:block;font-size:.66rem;color:var(--sub);font-weight:500;margin-bottom:3px}
.ninput{width:100%;padding:9px 11px;border:1.5px solid var(--g4);border-radius:9px;font-family:'Noto Sans JP',sans-serif;font-size:.86rem;background:var(--white);outline:none;-webkit-appearance:none;-moz-appearance:textfield;transition:.15s}
.ninput:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(74,170,120,.12)}
.ninput[type=number]::-webkit-inner-spin-button,.ninput[type=number]::-webkit-outer-spin-button{opacity:1;height:32px}
.nae-save{width:100%;padding:11px;background:var(--g2);color:#fff;border:none;border-radius:9px;font-family:'Noto Sans JP',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:6px}
.hpills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.hpill{font-size:.68rem;padding:4px 10px;border-radius:14px;background:var(--g4);color:var(--g0);cursor:pointer;border:none;font-family:'Noto Sans JP',sans-serif;transition:.12s;white-space:nowrap}
.hpill:hover{background:var(--g3);color:#fff}
.hpill.ap{background:var(--g2);color:#fff}
.vpill{font-size:.68rem;padding:4px 10px;border-radius:14px;background:var(--am2);color:#7a5000;cursor:pointer;border:none;font-family:'Noto Sans JP',sans-serif;transition:.12s;white-space:nowrap}
.vpill:hover{background:var(--am);color:#fff}
.vpill.ap{background:var(--am);color:#fff}

/* ibtn */
.ibtn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:6px;font-size:.82rem;line-height:1;transition:.13s}
.ibtn:hover{background:var(--g5)}
.ibtn.del:hover{background:var(--red2)}

/* settings */
.set-tabs{display:flex;background:var(--white);border-radius:10px;box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.set-tab{flex:1;padding:9px 4px;text-align:center;font-size:.7rem;font-weight:500;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;transition:.15s}
.set-tab.active{color:var(--g2);border-bottom-color:var(--g2);font-weight:700}
.set-section{background:var(--white);border-radius:13px;margin-bottom:13px;box-shadow:var(--sh);overflow:hidden}
.set-head{background:var(--g1);color:#fff;padding:9px 13px;font-size:.79rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.set-head-btn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:.72rem;padding:3px 9px;border-radius:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.set-row{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid #f0ede6;font-size:.81rem;gap:7px}
.set-row:last-child{border:none}
.set-ri{flex:1}
.set-rl{font-weight:600;color:var(--g0);font-size:.82rem}
.set-rs{font-size:.66rem;color:var(--sub);margin-top:1px}

/* drag edit rows */
.ed-row{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #f0ede6;background:var(--white);transition:.15s}
.ed-row:last-child{border:none}
.ed-row.drag-over{background:var(--g5);border:2px dashed var(--g3)}
.ed-row.dragging{opacity:.4}
.drag-h{cursor:grab;color:var(--sub);font-size:1rem;padding:0 4px;touch-action:none;user-select:none;flex-shrink:0}
.ed-inp{flex:1;padding:6px 9px;border:1.5px solid var(--g4);border-radius:7px;font-family:'Noto Sans JP',sans-serif;font-size:.83rem;outline:none;background:var(--white)}
.ed-inp:focus{border-color:var(--g3)}
.ed-inp.sub-inp{font-size:.72rem;color:var(--sub);margin-top:3px}
.add-row{display:flex;gap:8px;padding:10px 13px;border-top:1px solid var(--bdr)}
.add-inp{flex:1;padding:8px 10px;border:1.5px solid var(--g4);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.82rem;outline:none}
.add-btn{padding:8px 14px;background:var(--g2);color:#fff;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer}

/* CI sheet */
.ci-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:400;align-items:flex-end;justify-content:center}
.ci-overlay.open{display:flex}
.ci-sheet{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:94vh;overflow-y:auto;animation:sup .24s ease;display:flex;flex-direction:column}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ci-head{background:var(--g1);color:#fff;padding:13px 15px;border-radius:20px 20px 0 0;position:sticky;top:0;z-index:10}
.ci-head-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ci-head-title{font-size:.9rem;font-weight:700}
.ci-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.ci-chips{display:flex;gap:6px;flex-wrap:wrap}
.ci-chip{font-size:.65rem;padding:5px 9px;border-radius:12px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;transition:.14s;text-align:center;line-height:1.3}
.ci-chip:hover{background:rgba(255,255,255,.2)}
.ci-chip.sel{background:var(--g3);color:var(--g0);border-color:var(--g3);font-weight:700}
.ci-chip.ex{opacity:.32;cursor:default;text-decoration:line-through}
.ci-body{padding:13px 14px;flex:1}
.ci-sel-info{background:var(--g5);border-radius:10px;padding:10px 13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.ci-log{margin-bottom:12px}
.ci-log-title{font-size:.65rem;font-weight:700;color:var(--g2);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.ci-log-item{display:flex;align-items:center;justify-content:space-between;background:var(--g5);border-radius:8px;padding:7px 10px;margin-bottom:5px;font-size:.78rem;gap:6px}
.ci-log-l{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1}
.ci-undo{background:none;border:none;cursor:pointer;font-size:.78rem;color:var(--sub);padding:2px 6px;border-radius:5px}
.ci-undo:hover{background:var(--red2);color:var(--red)}
.ci-fg{margin-bottom:10px}
.ci-fg label{display:block;font-size:.67rem;font-weight:500;color:var(--sub);margin-bottom:3px}
.ci-fg input{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:9px;font-family:'Noto Sans JP',sans-serif;font-size:.88rem;outline:none;-webkit-appearance:none;-moz-appearance:textfield;transition:.15s}
.ci-fg input:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(74,170,120,.12)}
.ci-fg input[type=number]::-webkit-inner-spin-button,.ci-fg input[type=number]::-webkit-outer-spin-button{opacity:1;height:32px}
.ci-frow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ci-hist{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ci-save{width:100%;padding:13px;background:var(--g2);color:#fff;border:none;border-radius:11px;font-family:'Noto Sans JP',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:4px;transition:.15s}
.ci-save:hover{background:var(--g1)}
.ci-save:disabled{background:var(--sub);cursor:default}

/* FAB */
.fab-wrap{position:fixed;bottom:20px;right:15px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;z-index:150}
.fab{width:52px;height:52px;background:var(--g2);color:#fff;border:none;border-radius:50%;font-size:1.4rem;box-shadow:0 4px 18px rgba(40,99,74,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.fab:hover{transform:scale(1.08)}
.fab.sub{width:44px;height:44px;font-size:1.1rem;background:var(--am);box-shadow:0 4px 14px rgba(212,148,26,.4)}
.fab-lbl{font-size:.62rem;background:var(--g0);color:#fff;padding:3px 7px;border-radius:8px;white-space:nowrap}

/* edit overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:20px 20px 0 0;padding:19px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:sup .24s ease}
.modal h2{font-size:.9rem;font-weight:700;color:var(--g0);margin-bottom:12px}
.fg{margin-bottom:9px}
.fg label{display:block;font-size:.68rem;font-weight:500;color:var(--sub);margin-bottom:3px}
.fg input,.fg select{width:100%;padding:9px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.84rem;outline:none;-webkit-appearance:none;-moz-appearance:textfield;transition:.18s}
.fg input[type=number]::-webkit-inner-spin-button,.fg input[type=number]::-webkit-outer-spin-button{opacity:1}
.fg input:focus,.fg select:focus{border-color:var(--g3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mact{display:flex;gap:8px;margin-top:13px}
.btn-c{flex:1;padding:10px;border:1.5px solid var(--bdr);border-radius:8px;background:none;font-family:'Noto Sans JP',sans-serif;font-size:.83rem;color:var(--sub);cursor:pointer}
.btn-s{flex:2;padding:10px;background:var(--g2);color:#fff;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.83rem;font-weight:700;cursor:pointer}
.btn-del{flex:1;padding:10px;background:var(--red);color:#fff;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.83rem;font-weight:700;cursor:pointer}

/* toast */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--g0);color:#fff;padding:8px 18px;border-radius:20px;font-size:.76rem;z-index:600;opacity:0;transition:opacity .28s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;padding:30px 16px;color:var(--sub);font-size:.8rem}
.no-plant{color:var(--sub);font-size:.76rem;padding:7px 12px;font-style:italic}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <div class="h-sub">苗管理 N03 ／ 令和8年5月9日</div>
    <h1>🌱 苗・植え付け管理</h1>
  </div>
  <div style="display:flex;gap:5px;align-items:center">
    <button onclick="loadFromGitHub()"
      style="background:var(--g1);color:#fff;border:none;border-radius:8px;font-size:.65rem;padding:5px 9px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap">☁️ 読込</button>
    <button onclick="saveToGitHub()"
      style="background:var(--g2);color:#fff;border:none;border-radius:8px;font-size:.65rem;padding:5px 9px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap">💾 保存</button>
    <button onclick="showDataMenu()"
      style="background:var(--g1);color:#fff;border:none;border-radius:8px;font-size:.65rem;padding:5px 9px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap">⋯</button>
  </div>
</header>

<!-- DATA MENU -->
<div id="data-menu-overlay" onclick="hideDataMenu()"
  style="display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.3)"></div>
<div id="data-menu"
  style="display:none;position:fixed;top:52px;right:12px;z-index:260;background:var(--white);border-radius:13px;box-shadow:0 4px 24px rgba(0,0,0,.18);overflow:hidden;min-width:190px">
  <div style="background:var(--g1);color:#fff;padding:8px 14px;font-size:.72rem;font-weight:700">データ管理</div>
  <div id="sync-btn" style="padding:7px 14px;font-size:.7rem;color:var(--sub);border-bottom:1px solid var(--bdr)">☁️ 状態: 待機中</div>

<script>
// ═══════════════════════ DATA ═══════════════════════
let naeData = [
  {no:1,  date:'4/30',house:'4',          variety:'たいがん',   count:20},
  {no:2,  date:'4/30',house:'4',          variety:'Bごがね',    count:8},
  {no:3,  date:'4/30',house:'中村',       variety:'こがね',     count:19},
  {no:4,  date:'5/1', house:'3',          variety:'みちしずく', count:11},
  {no:5,  date:'5/1', house:'3',          variety:'紅まさり',   count:7},
  {no:6,  date:'5/2', house:'中村',       variety:'こがね',     count:12},
  {no:7,  date:'5/2', house:'こうすけ苗', variety:'まさり',     count:24},
  {no:8,  date:'5/3', house:'こうすけ苗', variety:'まさり',     count:37},
  {no:9,  date:'5/5', house:'1',          variety:'Bごがね',    count:29},
  {no:10, date:'5/5', house:'1',          variety:'Bごがね',    count:2},
  {no:11, date:'5/6', house:'2',          variety:'Bごがね',    count:15},
  {no:12, date:'5/5', house:'中村',       variety:'こがね',     count:5},
  {no:13, date:'5/7', house:'2',          variety:'Bごがね',    count:2},
  {no:14, date:'5/7', house:'5',          variety:'Bごがね',    count:17.5},
  {no:15, date:'5/7', house:'5',          variety:'こがね',     count:17},
  {no:16, date:'5/8', house:'5',          variety:'種まさり',   count:19},
  {no:17, date:'5/8', house:'4',          variety:'Bごがね',    count:6},
];
let plantData = [
  {id:1,  naeRef:1,  date:'5/2', field:'するき１', count:6,    note:'3列10マルチ'},
  {id:2,  naeRef:1,  date:'5/2', field:'正人黒山', count:14,   note:''},
  {id:3,  naeRef:2,  date:'5/2', field:'としのり', count:8,    note:'畝側1列引き'},
  {id:4,  naeRef:3,  date:'4/30',field:'フキエ',   count:1,    note:''},
  {id:5,  naeRef:3,  date:'4/30',field:'としのり', count:18,   note:'畝側列あり'},
  {id:6,  naeRef:4,  date:'5/5', field:'つやこ上', count:7.5,  note:''},
  {id:7,  naeRef:4,  date:'5/5', field:'するき２', count:3.5,  note:''},
  {id:8,  naeRef:5,  date:'5/2', field:'大川道',   count:3.5,  note:'3連設置あり'},
  {id:9,  naeRef:5,  date:'5/2', field:'エキ',     count:3.5,  note:''},
  {id:10, naeRef:6,  date:'5/2', field:'としのり', count:12,   note:'床側列埋む'},
  {id:11, naeRef:7,  date:'5/2', field:'別府小',   count:18,   note:''},
  {id:12, naeRef:7,  date:'5/4', field:'別府小',   count:6,    note:''},
  {id:13, naeRef:8,  date:'5/4', field:'エキ',     count:9,    note:''},
  {id:14, naeRef:8,  date:'5/4', field:'エキ',     count:7,    note:'3枚8分'},
  {id:15, naeRef:9,  date:'5/7', field:'としのり', count:13,   note:''},
  {id:16, naeRef:9,  date:'5/7', field:'としのり', count:16,   note:''},
  {id:17, naeRef:12, date:'5/7', field:'としのり', count:5,    note:'床側縦式'},
];
let _pid = 18;

// 品種マスタ — これが唯一の並び順ソース
let varietyOrder = ['たいがん','Bごがね','こがね','みちしずく','紅まさり','まさり','種まさり'];

// 畑マスタ
let fieldMaster = [
  {name:'するき１',note:''},{name:'正人黒山',note:''},{name:'としのり',note:''},
  {name:'フキエ',note:''},{name:'つやこ上',note:''},{name:'するき２',note:''},
  {name:'大川道',note:''},{name:'エキ',note:''},{name:'別府小',note:''},
];

let hist = {
  fields:['するき１','正人黒山','としのり','フキエ','つやこ上','するき２','大川道','エキ','別府小'],
  lastField:'としのり', lastHouse:'4', lastVariety:'',
};

// ═══════════════════════ HELPERS ═══════════════════════
const TODAY = new Date(2026,4,9); // R8.5.9固定
const todayStr = () => '2026-05-09';
const dateVal  = s => s?s.replace(/\d{4}-(\d{2})-(\d{2})/,(_,m,d)=>`${+m}/${+d}`):'';
const fmt      = n => n==null?'—':(n%1===0?String(n):(+n).toFixed(1));
const esc      = s => s.replace(/[^a-zA-Z0-9]/g,'_');

function parseNaeDate(s){
  if(!s)return null;
  const m=s.match(/(\d+)\/(\d+)/);
  return m?new Date(2026,+m[1]-1,+m[2]):null;
}
function daysSince(s){
  const d=parseNaeDate(s); if(!d)return 0;
  return Math.floor((TODAY-d)/(86400000));
}

function plantedForNae(no){ return plantData.filter(p=>p.naeRef===no).reduce((s,p)=>s+p.count,0); }
function remForNae(no){ const n=naeData.find(d=>d.no===no); return n?n.count-plantedForNae(no):0; }

function allVarieties(){
  const extra=[...new Set(naeData.map(d=>d.variety))].filter(v=>!varietyOrder.includes(v));
  return [...varietyOrder,...extra];
}
function naeTotalByVar(v){ return naeData.filter(d=>d.variety===v).reduce((s,d)=>s+d.count,0); }
function naePlantedByVar(v){ return naeData.filter(d=>d.variety===v).reduce((s,n)=>s+plantedForNae(n.no),0); }

function plantNoLabel(pid){
  const p=plantData.find(d=>d.id===pid); if(!p||p.naeRef==null)return '?';
  const sibs=plantData.filter(d=>d.naeRef===p.naeRef);
  return sibs.length===1?String(p.naeRef):`${p.naeRef}-${sibs.findIndex(d=>d.id===pid)+1}`;
}

function allFields(){
  const mn=fieldMaster.map(f=>f.name);
  const extra=[...new Set(plantData.map(p=>p.field))].filter(f=>!mn.includes(f));
  return [...mn,...extra];
}
function refreshFlists(){
  ['flist','ci-flist'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=allFields().map(f=>`<option value="${f}">`).join('');
  });
}
function refreshVlist(){
  const el=document.getElementById('vlist');
  if(el) el.innerHTML=allVarieties().map(v=>`<option value="${v}">`).join('');
}
function recordHist(f){
  if(!f)return;
  hist.fields=[f,...hist.fields.filter(x=>x!==f)].slice(0,12);
  hist.lastField=f;
  if(!fieldMaster.some(fm=>fm.name===f)) fieldMaster.push({name:f,note:''});
  refreshFlists();
}

function rbCls(r){ return r>0?'rok':r===0?'rzero':'rneg'; }
function rbLbl(r){ return r>0?`残 ${fmt(r)}`:r===0?'完植':`⚠ ${fmt(r)}`; }

function toast(msg,dur=2400){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
function rerenderBg(){
  renderDash();
  const keys=['dash','stock','nae','plant','field','settings'];
  const i=[...document.querySelectorAll('.tab')].findIndex(t=>t.classList.contains('active'));
  if(i>0&&renderMap[keys[i]]) renderMap[keys[i]]();
  saveLocalOnly();   // 端末ローカルに即保存
  markDirty();       // GitHub保存待ちフラグを立てる
}

// ═══════════════════════ ALERT ═══════════════════════
// 苗採りから5日以上経過して残りある苗
function alertNaes(){
  return naeData.filter(n=>remForNae(n.no)>0&&daysSince(n.date)>=5)
    .map(n=>({...n,days:daysSince(n.date),rem:remForNae(n.no)}));
}

// ═══════════════════════ CI ═══════════════════════
let ciNaeNo=null, ciSession=[];
function openCI(preNo){
  ciSession=[]; ciNaeNo=preNo;
  document.getElementById('ci-overlay').classList.add('open');
  buildChips();
  if(preNo!=null) selectCiNae(preNo);
  else renderCiForm();
}
function closeCI(){ document.getElementById('ci-overlay').classList.remove('open'); rerenderBg(); }
function buildChips(){
  document.getElementById('ci-chips').innerHTML=naeData.map(n=>{
    const rem=remForNae(n.no),ex=rem<=0,sel=n.no===ciNaeNo;
    return `<button class="ci-chip${sel?' sel':''}${ex?' ex':''}" ${ex?'':'onclick="selectCiNae('+n.no+')"'}
      title="${n.variety}/H${n.house}/残${fmt(rem)}">No.${n.no}<br><span style="font-size:.58rem;opacity:.75">${n.variety}<br>${fmt(rem)}箱</span></button>`;
  }).join('');
}
function selectCiNae(no){
  if(remForNae(no)<=0){toast('⚠ 完植です');return;}
  ciNaeNo=no; buildChips(); renderCiForm();
}
function renderCiForm(){
  const n=ciNaeNo!=null?naeData.find(d=>d.no===ciNaeNo):null;
  const rem=n?remForNae(n.no):0;
  const info=document.getElementById('ci-sel-info');
  info.innerHTML=n
    ?`<div><div style="font-weight:700;font-size:.9rem">苗No.${n.no}　${n.variety}</div>
       <div style="font-size:.7rem;color:var(--sub)">H${n.house} ／ ${n.date} ／ 採${fmt(n.count)}箱</div></div>
       <span class="rb ${rbCls(rem)}">${rbLbl(rem)}</span>`
    :`<div style="color:var(--sub);font-size:.85rem">← 苗Noを選択してください</div>`;
  // log
  const logWrap=document.getElementById('ci-log');
  const ses=plantData.filter(p=>ciSession.includes(p.id));
  if(ses.length){
    logWrap.style.display='block';
    document.getElementById('ci-log-items').innerHTML=ses.map(p=>`
      <div class="ci-log-item">
        <div class="ci-log-l">
          <span class="tag am" style="font-size:.62rem">苗${p.naeRef}</span>
          <span style="font-weight:600">📍${p.field}</span>
          <span class="tag">${fmt(p.count)}箱</span>
          <span style="font-size:.65rem;color:var(--sub)">${p.date}</span>
        </div>
        <button class="ci-undo" onclick="ciUndo(${p.id})">↩取消</button>
      </div>`).join('');
  } else logWrap.style.display='none';
  // form
  const fw=document.getElementById('ci-form-wrap');
  if(!n){fw.style.display='none';return;}
  fw.style.display='block';
  const de=document.getElementById('ci-date'); if(!de.value)de.value=todayStr();
  document.getElementById('ci-cnt-lbl').textContent=`箱数（残${fmt(rem)}）`;
  document.getElementById('ci-count').value='';
  document.getElementById('ci-field').value=hist.lastField;
  document.getElementById('ci-note').value='';
  // history pills
  document.getElementById('ci-hist').innerHTML=hist.fields.slice(0,8).map(f=>{
    const ap=f===hist.lastField?' ap':'';
    return `<button class="hpill${ap}" onclick="ciSetField('${f.replace(/'/g,"\\'")}')">📍${f}</button>`;
  }).join('');
  refreshFlists();
  const btn=document.getElementById('ci-save-btn');
  btn.disabled=rem<=0; btn.textContent=rem<=0?'完植':'植え付けを保存 → 次へ';
  setTimeout(()=>{const c=document.getElementById('ci-count');if(c)c.focus();},80);
}
function ciSetField(f){ document.getElementById('ci-field').value=f; hist.lastField=f; renderCiForm(); }
function ciSave(){
  if(ciNaeNo==null){toast('⚠ 苗Noを選んでください');return;}
  const field=document.getElementById('ci-field').value.trim();
  const count=parseFloat(document.getElementById('ci-count').value);
  const date=dateVal(document.getElementById('ci-date').value)||'5/9';
  const note=document.getElementById('ci-note').value.trim();
  if(!field){toast('⚠ 畑名を入力してください');document.getElementById('ci-field').focus();return;}
  if(isNaN(count)||count<=0){toast('⚠ 箱数を入力してください');document.getElementById('ci-count').value='';document.getElementById('ci-count').focus();return;}
  const rem=remForNae(ciNaeNo);
  if(count>rem+0.001){toast(`⚠ 残り${fmt(rem)}箱を超えています`);return;}
  const newId=_pid++;
  plantData.push({id:newId,naeRef:ciNaeNo,date,field,count,note});
  ciSession.push(newId);
  recordHist(field);
  const nae=naeData.find(n=>n.no===ciNaeNo);
  toast(`✅ 苗No.${ciNaeNo}（${nae?.variety}）→${field} ${fmt(count)}箱`,1800);
  if(remForNae(ciNaeNo)<=0){
    const next=naeData.find(n=>n.no>ciNaeNo&&remForNae(n.no)>0);
    if(next){ciNaeNo=next.no;toast(`完植。次の苗No.${next.no}（${next.variety}）へ`,2200);}
  }
  buildChips(); renderCiForm();
}
function ciUndo(id){
  plantData=plantData.filter(p=>p.id!==id);
  ciSession=ciSession.filter(x=>x!==id);
  buildChips(); renderCiForm(); toast('↩ 取り消しました');
}

// ═══════════════════════ DASHBOARD ═══════════════════════
function renderDash(){
  const el=document.getElementById('page-dash');
  const totalNae=naeData.reduce((s,d)=>s+d.count,0);
  const totalPlant=plantData.reduce((s,d)=>s+d.count,0);
  const houses=[...new Set(naeData.map(d=>d.house))];
  const vrows=allVarieties().map(v=>{
    const total=naeTotalByVar(v),planted=naePlantedByVar(v),rem=total-planted;
    return {v,total,planted,rem};
  }).filter(r=>r.total>0);

  // alert banner
  const alts=alertNaes();
  const alertHtml=alts.length?`
    <div style="background:#fff3cd;border:1.5px solid var(--am);border-radius:12px;padding:11px 13px;margin-bottom:10px">
      <div style="font-size:.75rem;font-weight:700;color:#7a5000;margin-bottom:7px">⚠️ 植え付け遅延アラート（苗採りから5日以上）</div>
      ${alts.map(n=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid #ffe69c;font-size:.8rem;gap:5px">
          <div>
            <span style="font-family:'Space Mono',monospace;color:var(--g2);font-weight:700">No.${n.no}</span>
            <span style="font-weight:600;margin-left:5px">${n.variety}</span>
            <span class="tag" style="margin-left:4px">H${n.house}</span>
            <span style="font-size:.68rem;color:#7a5000;margin-left:4px">${n.date}採（${n.days}日経過）</span>
          </div>
          <div style="display:flex;align-items:center;gap:5px">
            <span class="rb rneg" style="font-size:.62rem">残${fmt(n.rem)}箱</span>
            <button class="pbtn" style="font-size:.67rem;padding:4px 9px" onclick="openCI(${n.no})">🌾植付</button>
          </div>
        </div>`).join('')}
    </div>`:'' ;

  el.innerHTML=`
    ${alertHtml}
    <div class="stitle">品種別 在庫</div>
    ${vrows.map(({v,total,planted,rem})=>{
      const pc=total>0?Math.min(100,Math.round(planted/total*100)):0;
      const cls=rem<=0?'done':pc>=80?'warn':'';
      const naes=naeData.filter(n=>n.variety===v);
      const vid='vc_'+esc(v);
      return `<div class="vcard ${cls}">
        <div class="vcard-head" onclick="toggleVC('${vid}')">
          <div style="flex:1">
            <div class="vname">${v}</div>
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px">
              <span class="tag">採${fmt(total)}箱</span>
              <span class="tag am">植${fmt(planted)}箱</span>

function toggleP(id){ const e=document.getElementById(id);if(e)e.classList.toggle('open'); }
function qaSetH(h){ const e=document.getElementById('qa-house');if(e)e.value=h; hist.lastHouse=h; document.querySelectorAll('.hpill').forEach(p=>p.classList.toggle('ap',p.textContent===h)); }
function qaSetV(v){ const e=document.getElementById('qa-variety');if(e)e.value=v; hist.lastVariety=v; document.querySelectorAll('.vpill').forEach(p=>p.classList.toggle('ap',p.textContent===v)); }
function qaSave(){
  const variety=(document.getElementById('qa-variety')||{value:''}).value.trim();
  const count=parseFloat((document.getElementById('qa-count')||{value:''}).value);
  const house=(document.getElementById('qa-house')||{value:'-'}).value.trim()||'-';
  const date=dateVal((document.getElementById('qa-date')||{value:''}).value)||'5/9';
  const rawNo=parseInt((document.getElementById('qa-no')||{value:''}).value)||0;
  if(!variety){toast('⚠ 品種を入力してください');return;}
  if(isNaN(count)||count<=0){toast('⚠ 箱数を入力してください');return;}
  const autoNo=Math.max(0,...naeData.map(d=>d.no))+1;
  const no=rawNo||autoNo;
  if(naeData.find(d=>d.no===no)){toast(`⚠ 苗No.${no}はすでに存在します`);return;}
  naeData.push({no,date,house,variety,count});
  naeData.sort((a,b)=>a.no-b.no);
  if(!varietyOrder.includes(variety)) varietyOrder.push(variety);
  hist.lastHouse=house; hist.lastVariety=variety;
  toast(`✅ 苗No.${no}（${variety}）${fmt(count)}箱 を追加`);
  rerenderBg();
}

let plSort='nae_asc', plSearch='';
const PLSORTS=[['nae_asc','苗No↑'],['nae_desc','苗No↓'],['date','日付'],['count','箱数多']];
function renderPlant(){
  const se=document.getElementById('pl-search');if(se)plSearch=se.value.toLowerCase();
  const el=document.getElementById('page-plant');
  const groups={};
  plantData.forEach(p=>{const k=p.naeRef!=null?String(p.naeRef):'?';(groups[k]=groups[k]||[]).push(p);});
  let keys=Object.keys(groups);
  keys.sort((a,b)=>{
    if(plSort==='nae_asc')  return (+a||999)-(+b||999);
    if(plSort==='nae_desc') return (+b||999)-(+a||999);
    if(plSort==='date')     return (groups[a][0]?.date||'').localeCompare(groups[b][0]?.date||'');
    if(plSort==='count')    return groups[b].reduce((s,p)=>s+p.count,0)-groups[a].reduce((s,p)=>s+p.count,0);
    return 0;
  });
  const filtered=keys.filter(k=>groups[k].some(p=>!plSearch||p.field.toLowerCase().includes(plSearch)||(p.note||'').toLowerCase().includes(plSearch)));
  el.innerHTML=`
    <div class="fbar"><input id="pl-search" type="text" placeholder="畑名・備考で検索…" oninput="renderPlant()" value="${plSearch}"></div>
    <div class="sort-bar"><span class="sort-lbl">並び：</span>${PLSORTS.map(([k,l])=>`<button class="spill ${plSort===k?'active':''}" onclick="plSort='${k}';renderPlant()">${l}</button>`).join('')}</div>
    ${filtered.map(k=>{
      const rows=groups[k].filter(p=>!plSearch||p.field.toLowerCase().includes(plSearch)||(p.note||'').toLowerCase().includes(plSearch));
      if(!rows.length)return '';
      const nae=k!=='?'?naeData.find(n=>n.no===+k):null;
      const total=rows.reduce((s,p)=>s+p.count,0);
      const rem=nae?remForNae(nae.no):null;
      const head=nae?`苗No.${nae.no}（${nae.variety}/H${nae.house}）`:`グループ${k}`;
      return `<div class="plant-no-card">
        <div class="plant-no-head">
          <span>🌾 ${head}</span>
          <div style="display:flex;align-items:center;gap:7px">
            <span style="font-family:'Space Mono',monospace">${fmt(total)}箱</span>
            ${rem!=null?`<span class="rb ${rbCls(rem)}" style="font-size:.62rem">${rbLbl(rem)}</span>`:''}
            ${rem>0?`<button class="pbtn" style="font-size:.67rem;padding:4px 8px" onclick="openCI(${nae.no})">🌾追加</button>`:''}
          </div>
        </div>
        ${rows.map(p=>`<div class="plant-row">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="tag am" style="font-family:'Space Mono',monospace;font-weight:700">植${plantNoLabel(p.id)}</span>
              <span style="font-weight:700">📍${p.field}</span>
              <span class="tag">${p.date}</span>
            </div>
            <div style="display:flex;align-items:center;gap:4px">
              <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--am)">${fmt(p.count)}箱</span>
              <button class="ibtn" onclick="editPlant(${p.id})">✏️</button>
              <button class="ibtn del" onclick="delPlant(${p.id})">🗑️</button>
            </div>
          </div>
          ${p.note?`<div style="font-size:.66rem;color:var(--sub);margin-top:3px;font-style:italic">${p.note}</div>`:''}
        </div>`).join('')}
      </div>`;
    }).join('')}`;

let fieldSort='count', fieldSearch='';

    if(fieldSort==='name')  return a.localeCompare(b,'ja');

      const da=(groups[a]||[]).slice(-1)[0]?.date||'';

            ${rows.length?`<span style="font-family:'Space Mono',monospace">${fmt(total)}箱</span>`:'<span style="font-size:.7rem;opacity:.7">記録なし</span>'}

                  ${nae?`<span class="tag h">苗No.${nae.no} ${nae.variety}</span>`:''}
                  <span class="tag am">植${plantNoLabel(p.id)}</span>
                  ${p.note?`<span class="tag">${p.note}</span>`:''}
                </div>
              </div>
              <div style="display:flex;gap:4px">
                <button class="ibtn" onclick="editPlant(${p.id})">✏️</button>

          ${rows.length?`<div style="padding:7px 13px;background:var(--g5);font-size:.76rem;color:var(--g2);font-weight:600">合計${fmt(total)}箱 ／ ${rows.length}回</div>`:''}

// ── Variety editor ──
let vDragIdx=null;
function getVarList(){ return [...(document.querySelectorAll('[id^="vi-"]'))].map(el=>el.value.trim()).filter(Boolean); }
function vDragStart(e,i){ vDragIdx=i; }
function vDrop(e,i){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(vDragIdx===null||vDragIdx===i)return;
  const v=getVarList(); const [m]=v.splice(vDragIdx,1); v.splice(i,0,m);
  varietyOrder=[...v]; vDragIdx=null; renderSettings();
}
function saveVarOrder(){
  const v=getVarList(); if(!v.length){toast('⚠ 品種が空です');return;}
  // 名前変更反映
  varietyOrder.forEach((ov,i)=>{ const nv=v[i]; if(nv&&nv!==ov) naeData.forEach(n=>{if(n.variety===ov)n.variety=nv;}); });
  varietyOrder=[...v]; toast('✅ 品種を保存しました'); rerenderBg();
}
function moveV(i,dir){
  const v=getVarList(); const j=i+dir; if(j<0||j>=v.length)return;
  [v[i],v[j]]=[v[j],v[i]]; varietyOrder=[...v]; renderSettings();
}
function addV(){
  const inp=document.getElementById('new-var');if(!inp)return;
  const name=inp.value.trim(); if(!name){toast('⚠ 品種名を入力');return;}
  const cur=getVarList(); if(cur.includes(name)){toast('⚠ すでに存在します');return;}
  varietyOrder=[...cur,name]; inp.value=''; renderSettings(); toast(`✅「${name}」を追加`);
}
function removeV(i){
  const v=getVarList(); const name=v[i];
  if(naeData.some(n=>n.variety===name)){toast(`⚠「${name}」は苗データで使用中`);return;}
  if(!confirm(`「${name}」を削除しますか？`))return;
  varietyOrder=v.filter((_,j)=>j!==i); renderSettings(); toast(`「${name}」を削除しました`);
}

// ── Field master editor ──
let fdDragIdx=null;
function getFdList(){ return [...(document.querySelectorAll('[id^="fn-"]'))].map((el,i)=>({name:el.value.trim(),note:(document.getElementById('fm-'+i)||{value:''}).value.trim()})).filter(f=>f.name); }
function fdDragStart(e,i){ fdDragIdx=i; }
function fdDrop(e,i){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(fdDragIdx===null||fdDragIdx===i)return;
  const fds=getFdList(); const [m]=fds.splice(fdDragIdx,1); fds.splice(i,0,m);
  fieldMaster=[...fds]; fdDragIdx=null; renderSettings();
}
function saveFdMaster(){
  const fds=getFdList(); if(!fds.length){toast('⚠ 畑が空です');return;}
  fieldMaster.forEach((old,i)=>{
    const nw=fds[i]; if(nw&&nw.name&&nw.name!==old.name){
      plantData.forEach(p=>{if(p.field===old.name)p.field=nw.name;});
      hist.fields=hist.fields.map(f=>f===old.name?nw.name:f);
      if(hist.lastField===old.name)hist.lastField=nw.name;
    }
  });
  fieldMaster=[...fds]; toast('✅ 畑マスタを保存しました'); rerenderBg();
}
function moveFd(i,dir){
  const fds=getFdList(); const j=i+dir; if(j<0||j>=fds.length)return;
  [fds[i],fds[j]]=[fds[j],fds[i]]; fieldMaster=[...fds]; renderSettings();
}
function addFd(){
  const inp=document.getElementById('new-field');if(!inp)return;
  const name=inp.value.trim(); if(!name){toast('⚠ 畑名を入力');return;}
  const cur=getFdList(); if(cur.some(f=>f.name===name)){toast('⚠ すでに存在します');return;}
  fieldMaster=[...cur,{name,note:''}]; inp.value=''; renderSettings(); toast(`✅「${name}」を追加`); refreshFlists();
}
function removeFd(i){
  const fds=getFdList(); const f=fds[i];
  const used=plantData.some(p=>p.field===f.name);
  if(!confirm(`「${f.name}」を${used?'（植え付けデータあり）':''}削除しますか？`))return;
  fieldMaster=fds.filter((_,j)=>j!==i); renderSettings(); toast(`「${f.name}」を削除`); refreshFlists();
}

function delRec(){
  if(!editMode)return;
  if(editMode.type==='nae'){
    const r=naeData.find(d=>d.no===editMode.no);

function saveRec(){
  const t=document.getElementById('m-type').value;
  const note=document.getElementById('m-note').value.trim();
  if(editMode){
    if(editMode.type==='nae'){
      const r=naeData.find(d=>d.no===editMode.no);if(!r)return;
      const v=document.getElementById('m-variety').value.trim();
      const c=parseFloat(document.getElementById('m-count').value);
      if(!v){toast('⚠ 品種を入力');return;}
      if(isNaN(c)||c<=0){toast('⚠ 箱数を入力');return;}
      r.house=document.getElementById('m-house').value.trim()||r.house;
      r.variety=v; r.count=c;
      if(!varietyOrder.includes(v))varietyOrder.push(v);
      toast(`✅ 苗No.${r.no} を更新`);
    } else {
      const p=plantData.find(d=>d.id===editMode.id);if(!p)return;
      const f=document.getElementById('m-field').value.trim();
      const c=parseFloat(document.getElementById('m-pcount').value);
      if(!f){toast('⚠ 畑名を入力');return;}
      if(isNaN(c)||c<=0){toast('⚠ 箱数を入力');return;}
      const pd=document.getElementById('m-pdate').value;if(pd)p.date=dateVal(pd);
      p.field=f; p.count=c; p.naeRef=parseInt(document.getElementById('m-refnae').value)||null; p.note=note;
      recordHist(f); toast('✅ 植え付け記録を更新');
    }
  } else {
    if(t==='nae'){
      const v=document.getElementById('m-variety').value.trim();
      const c=parseFloat(document.getElementById('m-count').value);
      if(!v){toast('⚠ 品種を入力');return;}
      if(isNaN(c)||c<=0){toast('⚠ 箱数を入力');return;}
      const autoNo=Math.max(0,...naeData.map(d=>d.no))+1;
      const no=parseInt(document.getElementById('m-naeno').value)||autoNo;
      if(naeData.find(d=>d.no===no)){toast(`⚠ 苗No.${no}はすでに存在`);return;}
      const date=dateVal(document.getElementById('m-date').value)||'5/9';
      naeData.push({no,date,house:document.getElementById('m-house').value.trim()||'-',variety:v,count:c});
      naeData.sort((a,b)=>a.no-b.no);
      if(!varietyOrder.includes(v))varietyOrder.push(v);
      toast(`✅ 苗No.${no}（${v}）を追加`);
    } else {
      const f=document.getElementById('m-field').value.trim();
      const c=parseFloat(document.getElementById('m-pcount').value);
      if(!f){toast('⚠ 畑名を入力');return;}
      if(isNaN(c)||c<=0){toast('⚠ 箱数を入力');return;}
      const date=dateVal(document.getElementById('m-pdate').value)||'5/9';
      const naeRef=parseInt(document.getElementById('m-refnae').value)||null;
      plantData.push({id:_pid++,naeRef,date,field:f,count:c,note});
      recordHist(f); toast(`✅ ${f} ${fmt(c)}箱 を追加`);
    }
  }
  closeModal(); rerenderBg();
}

// ═══════════════════════ GITHUB SYNC ═══════════════════════
const GH_REPO  = 'italfarm92-eng/naekanni';
const GH_FILE  = 'data.json';
const GH_API   = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
const TOKEN_KEY = 'gh_token_naekanni';

let syncStatus = 'idle';
function setSyncUI(status, msg='') {
  syncStatus = status;
  const el = document.getElementById('sync-btn');
  if(!el) return;
  const icons = {idle:'☁️', loading:'⏳', saving:'💾', error:'❌', ok:'✅'};
  el.textContent = (icons[status]||'☁️') + (msg ? ' '+msg : '');
}

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}
function setToken(t) {
  localStorage.setItem(TOKEN_KEY, t.trim());
}

function promptToken() {
  const cur = getToken();
  const t = prompt(
    'GitHub Personal Access Tokenを入力してください\n\n' +
    '取得方法: GitHub → Settings → Developer settings\n' +
    '→ Personal access tokens → Tokens(classic)\n' +
    '→ Generate new token → repo にチェック\n\n' +
    '現在の値: ' + (cur ? cur.slice(0,8)+'...' : '未設定'),
    cur
  );
  if(t !== null && t.trim()) {
    setToken(t);
    toast('✅ トークンを保存しました');
    return t.trim();
  }
  return cur;
}

// GitHub から data.json を読み込む
async function loadFromGitHub() {
  setSyncUI('loading','読込中…');
  try {
    const res = await fetch(GH_API + '?t=' + Date.now(), {
      headers: {'Accept':'application/vnd.github+json'}
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const meta = await res.json();
    const json = JSON.parse(atob(meta.content.replace(/\n/g,'')));
    if(json.naeData     && json.naeData.length)      naeData      = json.naeData;
    if(json.plantData   && json.plantData.length)    plantData    = json.plantData;
    if(json.varietyOrder&& json.varietyOrder.length) varietyOrder = json.varietyOrder;
    if(json.fieldMaster && json.fieldMaster.length)  fieldMaster  = json.fieldMaster;
    if(json.hist)                                    hist         = json.hist;
    if(json._pid)                                    _pid         = json._pid;
    if(plantData.length) _pid = Math.max(_pid, Math.max(...plantData.map(p=>p.id))+1);
    // ローカルにもキャッシュ
    saveLocalOnly();
    setSyncUI('ok', '読込済');
    rerenderBgNoSync();
    toast('✅ GitHubからデータを読み込みました');
  } catch(err) {
    setSyncUI('error','読込失敗');
    toast('❌ 読込失敗: ' + err.message);
  }
}

// GitHub へ data.json を保存する
async function saveToGitHub() {
  let token = getToken();
  if(!token) { token = promptToken(); }
  if(!token) { toast('⚠ トークンが必要です'); return; }
  setSyncUI('saving','保存中…');
  try {
    // 現在のSHAを取得
    const resGet = await fetch(GH_API, {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json'
      }
    });
    let sha = null;
    if(resGet.ok) { const m = await resGet.json(); sha = m.sha; }

    const content = {naeData, plantData, varietyOrder, fieldMaster, hist, _pid};
    const body = {
      message: 'データ更新 ' + new Date().toLocaleString('ja-JP'),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
    };
    if(sha) body.sha = sha;

    const resPut = await fetch(GH_API, {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if(!resPut.ok) {
      const err = await resPut.json();
      throw new Error(err.message || 'HTTP ' + resPut.status);
    }
    saveLocalOnly(); // ローカルにもキャッシュ
    setSyncUI('ok', '保存済');
    toast('✅ GitHubに保存しました');
  } catch(err) {
    setSyncUI('error','保存失敗');
    toast('❌ 保存失敗: ' + err.message);
  }
}

// ═══════════════════════ LOCAL STORAGE ═══════════════════════
const LS_KEY = 'naekanni_v1';

// ローカルのみ保存（GitHub同期なし）
function saveLocalOnly() {
  try {
    const data = {naeData, plantData, varietyOrder, fieldMaster, hist, _pid};
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e) {}
}

// rerenderBg のGitHubなし版（ロード時などに使用）
function rerenderBgNoSync() {
  renderDash();
  const keys=['dash','stock','nae','plant','field','settings'];
  const i=[...document.querySelectorAll('.tab')].findIndex(t=>t.classList.contains('active'));
  if(i>0&&renderMap[keys[i]]) renderMap[keys[i]]();
}

function saveLocal() {
  saveLocalOnly();
  const ts = new Date().toLocaleTimeString('ja-JP');
  setSyncUI('idle', ts + ' 自動保存');
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data.naeData     && data.naeData.length)      naeData       = data.naeData;
    if(data.plantData   && data.plantData.length)     plantData     = data.plantData;
    if(data.varietyOrder&& data.varietyOrder.length)  varietyOrder  = data.varietyOrder;
    if(data.fieldMaster && data.fieldMaster.length)   fieldMaster   = data.fieldMaster;
    if(data.hist)                                      hist          = data.hist;
    if(data._pid)                                      _pid          = data._pid;
    return true;
  } catch(e) {
    return false;
  }
}

function clearLocal() {
  if(!confirm('保存データをすべて削除しますか？\nこの操作は取り消せません。')) return;
  localStorage.removeItem(LS_KEY);
  toast('🗑 データをクリアしました。ページを再読み込みしてください。');
}

function exportJSON() {
  const data = {naeData, plantData, varietyOrder, fieldMaster};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'naekanni_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('✅ バックアップをダウンロードしました');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!data.naeData) { toast('⚠ 正しいバックアップファイルではありません'); return; }
        if(!confirm('現在のデータをバックアップファイルで上書きしますか？')) return;
        naeData       = data.naeData;
        plantData     = data.plantData     || [];
        varietyOrder  = data.varietyOrder  || [];
        fieldMaster   = data.fieldMaster   || [];
        _pid = plantData.length ? Math.max(...plantData.map(p=>p.id))+1 : 18;
        saveLocal();
        rerenderBg();
        toast('✅ インポートしました');
      } catch(err) { toast('⚠ 読み込みエラー: ' + err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// rerenderBg に自動保存を統合済み（下記で定義）

// ═══════════════════════ AUTO SAVE ═══════════════════════
let autoSaveTimer = null;
let pendingSave = false;

// データ変更時に「保存待ち」フラグを立てる
function markDirty() {
  pendingSave = true;
  setSyncUI('idle', '未保存あり ●');
}

// 自動保存チェック（30秒ごとに未保存があれば保存）
function startAutoSave() {
  autoSaveTimer = setInterval(async () => {
    if(pendingSave && getToken()) {
      pendingSave = false;
      await saveToGitHub();
    }
  }, 30000); // 30秒
}

// アプリを閉じる前にも保存
window.addEventListener('beforeunload', () => {
  if(pendingSave && getToken()) saveToGitHub();
});

// Safariでホーム画面から閉じた時
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'hidden' && pendingSave && getToken()) {
    pendingSave = false;
    await saveToGitHub();
  }
});

// ═══════════════════════ INIT ═══════════════════════
const loaded = loadLocal();
renderDash(); refreshFlists(); refreshVlist();
if(loaded) {
  setSyncUI('ok', 'データ読込済');
} else {
  setSyncUI('idle', '初回起動');
}
// 起動時にGitHubから最新データを読み込む
if(getToken()) {
  loadFromGitHub();
}
// 自動保存スタート
startAutoSave();
</script>
